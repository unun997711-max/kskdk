              status_label.text = "جاهز للعب"
              status_label.autowrap_mode = TextServer.AUTOWRAP_WORD_SMART
              layout.add_child(status_label)

              leave_button = _make_button("مغادرة الغرفة")
              leave_button.pressed.connect(_on_leave_pressed)
              layout.add_child(leave_button)

          func _make_button(caption: String) -> Button:
              var button := Button.new()
              button.text = caption
              button.custom_minimum_size = Vector2(0, 42)
              return button

          func _on_solo_pressed() -> void:
              RoomNetwork.close_room()
              status_label.text = "بدأ اللعب الفردي"
              visible = false

          func _on_create_pressed() -> void:
              var code := RoomNetwork.create_room()
              if code.is_empty():
                  code_display.text = ""
                  return
              code_display.text = code
              status_label.text = "أرسل الرمز إلى أصدقائك"

          func _on_copy_pressed() -> void:
              if code_display.text.is_empty():
                  status_label.text = "أنشئ غرفة أولاً"
                  return
              DisplayServer.clipboard_set(code_display.text)
              status_label.text = "تم نسخ رمز الغرفة"

          func _on_join_pressed() -> void:
              var code := code_input.text.strip_edges()
              if code.is_empty():
                  status_label.text = "أدخل رمز الغرفة أولاً"
                  return
              RoomNetwork.join_room(code)

          func _on_leave_pressed() -> void:
              RoomNetwork.close_room()
              code_display.text = ""
              status_label.text = "غادرت الغرفة"

          func _on_status_changed(message: String) -> void:
              status_label.text = message

          func _on_players_changed(players: Array) -> void:
              players_label.text = "اللاعبون: %d / 4" % players.size()
          EOF

          python3 - <<'PY'
          from pathlib import Path

          project = Path("ILARION/project.godot")
          content = project.read_text(encoding="utf-8")

          entries = [
              'RoomNetwork="*res://scripts/network/room_network.gd"',
              'RoomMenu="*res://scripts/ui/room_menu.gd"'
          ]

          if "[autoload]" not in content:
              content += "\n[autoload]\n"
              content += "\n".join(entries) + "\n"
          else:
              start = content.index("[autoload]") + len("[autoload]")
              end = content.find("\n[", start)
              if end == -1:
                  end = len(content)
              section = content[start:end]
              for entry in entries:
                  name = entry.split("=")[0]
                  if name + "=" not in section:
                      section += "\n" + entry
              content = content[:start] + section + content[end:]

          project.write_text(content, encoding="utf-8")
          print("ILARION LAN room system files created.")
          PY

      - name: ILARION - Multiplayer Synchronization and Save System
        shell: bash
        run: |
          mkdir -p ILARION/scripts/network
          mkdir -p ILARION/scripts/systems

          cat > ILARION/scripts/network/network_player.gd <<'EOF'
          extends CharacterBody2D

          @export var movement_speed := 180.0
          @export var interpolation_speed := 12.0

          var network_id := 1
          var target_position := Vector2.ZERO
          var target_velocity := Vector2.ZERO
          var is_local_player := false

          func _ready() -> void:
              set_multiplayer_authority(network_id)
              is_local_player = is_multiplayer_authority()
              target_position = global_position

          func _physics_process(delta: float) -> void:
              if is_local_player:
                  _local_movement()
                  if multiplayer.has_multiplayer_peer():
                      sync_position.rpc(global_position, velocity)
              else:
                  global_position = global_position.lerp(
                      target_position,
                      clampf(delta * interpolation_speed, 0.0, 1.0)
                  )

          func _local_movement() -> void:
              var direction := Vector2.ZERO
              direction.x = Input.get_axis("move_left", "move_right")
              direction.y = Input.get_axis("move_up", "move_down")
              direction = direction.normalized()
              velocity = direction * movement_speed
              move_and_slide()

          @rpc("authority", "unreliable_ordered")
          func sync_position(position: Vector2, remote_velocity: Vector2) -> void:
              if is_local_player:
                  return
              target_position = position
              target_velocity = remote_velocity

          @rpc("any_peer", "call_remote", "reliable")
          func request_attack(attack_id: int) -> void:
              if not multiplayer.is_server():
                  return
              var sender := multiplayer.get_remote_sender_id()
              if sender <= 0:
                  return
              confirm_attack.rpc(sender, attack_id)

          @rpc("authority", "call_local", "reliable")
          func confirm_attack(attacker_id: int, attack_id: int) -> void:
              print("Player ", attacker_id, " performed attack ", attack_id)
          EOF

          cat > ILARION/scripts/systems/save_system.gd <<'EOF'
          extends Node

          const SAVE_PATH := "user://ilarion_save.json"

          var save_data := {
              "version": 1,
              "player_level": 1,
              "player_experience": 0,
              "current_region": "forgotten_lands",
              "unlocked_regions": ["forgotten_lands"],
              "completed_quests": [],
              "collected_items": [],
              "play_time": 0.0,
              "settings": {
                  "master_volume": 1.0,
                  "music_volume": 0.8,
                  "effects_volume": 1.0
              }
          }

          func _ready() -> void:
              load_game()

          func save_game() -> bool:
              var file := FileAccess.open(SAVE_PATH, FileAccess.WRITE)
              if file == null:
                  push_error("Could not open save file")
                  return false

              file.store_string(JSON.stringify(save_data, "\t"))
              file.close()
              return true

          func load_game() -> bool:
              if not FileAccess.file_exists(SAVE_PATH):
                  return false

              var file := FileAccess.open(SAVE_PATH, FileAccess.READ)
              if file == null:
                  return false

              var parsed = JSON.parse_string(file.get_as_text())
              file.close()

              if typeof(parsed) != TYPE_DICTIONARY:
                  return false

              save_data = parsed
              return true

          func set_value(key: String, value: Variant) -> void:
              save_data[key] = value
              save_game()

          func get_value(key: String, default_value: Variant = null) -> Variant:
              return save_data.get(key, default_value)

          func add_experience(amount: int) -> void:
              save_data.player_experience += maxi(amount, 0)
              save_game()

          func unlock_region(region_id: String) -> void:
              if not save_data.unlocked_regions.has(region_id):
                  save_data.unlocked_regions.append(region_id)
                  save_game()

          func complete_quest(quest_id: String) -> void:
              if not save_data.completed_quests.has(quest_id):
                  save_data.completed_quests.append(quest_id)
                  save_game()

          func reset_save() -> void:
              save_data = {
                  "version": 1,
                  "player_level": 1,
                  "player_experience": 0,
                  "current_region": "forgotten_lands",
                  "unlocked_regions": ["forgotten_lands"],
                  "completed_quests": [],
                  "collected_items": [],
                  "play_time": 0.0,
                  "settings": {
                      "master_volume": 1.0,
                      "music_volume": 0.8,
                      "effects_volume": 1.0
                  }
              }
              save_game()
          EOF

          cat > ILARION/scripts/systems/audio_settings.gd <<'EOF'
          extends Node

          const DEFAULT_MASTER := 1.0
          const DEFAULT_MUSIC := 0.8
          const DEFAULT_EFFECTS := 1.0

          var master_volume := DEFAULT_MASTER
          var music_volume := DEFAULT_MUSIC
          var effects_volume := DEFAULT_EFFECTS

          func _ready() -> void:
              load_settings()

          func set_master_volume(value: float) -> void:
              master_volume = clampf(value, 0.0, 1.0)
              _apply_volume("Master", master_volume)
              _save_settings()

          func set_music_volume(value: float) -> void:
              music_volume = clampf(value, 0.0, 1.0)
              _apply_volume("Music", music_volume)
              _save_settings()

          func set_effects_volume(value: float) -> void:
              effects_volume = clampf(value, 0.0, 1.0)
              _apply_volume("Effects", effects_volume)
              _save_settings()

          func _apply_volume(bus_name: String, value: float) -> void:
              var bus := AudioServer.get_bus_index(bus_name)
              if bus < 0:
                  return

              var linear := maxf(value, 0.0001)
              AudioServer.set_bus_volume_db(bus, linear_to_db(linear))
              AudioServer.set_bus_mute(bus, value <= 0.0)

          func _save_settings() -> void:
              var settings := {
                  "master_volume": master_volume,
                  "music_volume": music_volume,
                  "effects_volume": effects_volume
              }

              var file := FileAccess.open("user://audio_settings.json", FileAccess.WRITE)
              if file != null:
                  file.store_string(JSON.stringify(settings))
                  file.close()

          func load_settings() -> void:
              if not FileAccess.file_exists("user://audio_settings.json"):
                  _apply_all()
                  return

              var file := FileAccess.open("user://audio_settings.json", FileAccess.READ)
              if file == null:
                  _apply_all()
                  return

              var data = JSON.parse_string(file.get_as_text())
              file.close()

              if typeof(data) == TYPE_DICTIONARY:
                  master_volume = clampf(float(data.get("master_volume", DEFAULT_MASTER)), 0.0, 1.0)
                  music_volume = clampf(float(data.get("music_volume", DEFAULT_MUSIC)), 0.0, 1.0)
                  effects_volume = clampf(float(data.get("effects_volume", DEFAULT_EFFECTS)), 0.0, 1.0)

              _apply_all()

          func _apply_all() -> void:
              _apply_volume("Master", master_volume)
              _apply_volume("Music", music_volume)
              _apply_volume("Effects", effects_volume)
          EOF

          python3 - <<'PY'
          from pathlib import Path

          project = Path("ILARION/project.godot")
          if not project.exists():
              raise SystemExit("ERROR: ILARION/project.godot is missing")

          content = project.read_text(encoding="utf-8")
          entries = [
              'SaveSystem="*res://scripts/systems/save_system.gd"',
              'AudioSettings="*res://scripts/systems/audio_settings.gd"'
          ]

          if "[autoload]" not in content:
              content += "\n[autoload]\n" + "\n".join(entries) + "\n"
          else:
              start = content.index("[autoload]") + len("[autoload]")
              end = content.find("\n[", start)
              if end < 0:
                  end = len(content)

              section = content[start:end]
              for entry in entries:
                  key = entry.split("=")[0]
                  if key + "=" not in section:
                      section += "\n" + entry

              content = content[:start] + section + content[end:]

          project.write_text(content, encoding="utf-8")
          print("Save and audio systems registered.")
          PY

      - name: ILARION - Validate Project Sources
        shell: bash
        run: |
          set -e
          test -f ILARION/project.godot
          test -f ILARION/scripts/network/room_network.gd
          test -f ILARION/scripts/ui/room_menu.gd
          test -f ILARION/scripts/network/network_player.gd
          test -f ILARION/scripts/systems/save_system.gd
          test -f ILARION/scripts/systems/audio_settings.gd

          echo "All required source files exist."
          echo "This check verifies file presence, not Godot runtime correctness."

      - name: ILARION - Prepare Android Export
        shell: bash
        run: |
          set -euo pipefail

          GODOT_BIN="${GODOT_BIN:-$(command -v godot || command -v godot4 || true)}"
          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: Godot 4.3 executable not found"
            exit 1
          fi

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "ERROR: ANDROID_HOME and ANDROID_SDK_ROOT are missing"
            exit 1
          fi

          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is missing"
            exit 1
          fi

          test -d "$SDK/platforms/android-34"
          test -d "$SDK/build-tools/34.0.0"

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '[resource]' \
            "export/android/android_sdk_path = \"$SDK\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.tres"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          TEMP_DIR="$(mktemp -d)"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O "$TEMP_DIR/templates.tpz"

          unzip -q "$TEMP_DIR/templates.tpz" -d "$TEMP_DIR/unpacked"

          find "$TEMP_DIR/unpacked" -type f \
            \( -name 'android_debug.apk' -o -name 'android_release.apk' \) \
            -exec cp {} "$TEMPLATE_DIR/" \;

          printf '%s\n' "4.3.stable" > "$TEMPLATE_DIR/version.txt"

          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

          echo "Android export templates installed."

      - name: ILARION - Create Android Export Preset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ILARION/build

          printf '%s\n' \
            '[preset.0]' \
            'name="Android"' \
            'platform="Android"' \
            'runnable=true' \
            'dedicated_server=false' \
            'custom_features=""' \
            'export_filter="all_resources"' \
            'include_filter=""' \
            'exclude_filter=""' \
            'export_path="build/ILARION.apk"' \
            'encryption_include_filters=""' \
            'encryption_exclude_filters=""' \
            'encrypt_pck=false' \
            'encrypt_directory=false' \
            '' \
            '[preset.0.options]' \
            'custom_template/debug=""' \
            'custom_template/release=""' \
            'gradle_build/use_gradle_build=false' \
            'gradle_build/export_format=0' \
            'gradle_build/min_sdk=23' \
            'gradle_build/target_sdk=34' \
            'architectures/armeabi-v7a=false' \
            'architectures/arm64-v8a=true' \
            'package/unique_name="com.ilarion.game"' \
            'version/code=1' \
            'version/name="1.0"' \
            'screen/immersive_mode=true' \
            'permissions/internet=true' \
            > ILARION/export_presets.cfg

          echo "Android export preset created."

      - name: ILARION - Import and Validate Godot Project
        shell: bash
        run: |
          set -euo pipefail

          test -f ILARION/project.godot
          test -f ILARION/export_presets.cfg
          test -f ILARION/main.tscn

          GODOT_BIN="${GODOT_BIN:-$(command -v godot || command -v godot4 || true)}"
          test -n "$GODOT_BIN"

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path ILARION \
            --import \
            --quit

          echo "Godot project import completed."

      - name: ILARION - Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          GODOT_BIN="${GODOT_BIN:-$(command -v godot || command -v godot4 || true)}"
          mkdir -p ILARION/build

          "$GODOT_BIN" \
            --headless \
            --path ILARION \
            --export-debug \
            "Android" \
            "ILARION/build/ILARION.apk"

          test -s ILARION/build/ILARION.apk

          echo "APK successfully generated."
          ls -lh ILARION/build/ILARION.apk

      - name: ILARION - Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ILARION-Android-APK
          path: ILARION/build/ILARION.apk
          if-no-files-found: error
          retention-days: 14
