      - name: Create damage number effect
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/scripts/combat/damage_number.gd" <<'EOF'
          extends Node2D

          var damage_value: int = 0
          var lifetime: float = 0.8
          var elapsed: float = 0.0

          var rise_speed: float = 25.0
          var critical: bool = false

          func setup(value: int, is_critical: bool = false) -> void:
              damage_value = value
              critical = is_critical

          func _process(delta: float) -> void:
              elapsed += delta

              position.y -= rise_speed * delta

              if elapsed >= lifetime:
                  queue_free()

              queue_redraw()

          func _draw() -> void:
              var font := ThemeDB.fallback_font

              var color := Color(
                  1.0,
                  0.85,
                  0.35
              )

              if critical:
                  color = Color(
                      1.0,
                      0.2,
                      0.25
                  )

              var size := 9

              if critical:
                  size = 12

              draw_string(
                  font,
                  Vector2(-8, 0),
                  str(damage_value),
                  HORIZONTAL_ALIGNMENT_CENTER,
                  32,
                  size,
                  color
              )

              var alpha := 1.0 - (
                  elapsed / lifetime
              )

              modulate.a = clampf(
                  alpha,
                  0.0,
                  1.0
              )
          EOF

      # ==========================================
      # 23 - HIT EFFECT CONTROLLER
      # ==========================================

      - name: Create combat effects controller
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/scripts/combat/combat_effects.gd" <<'EOF'
          extends Node2D
          class_name CombatEffects

          var effects: Array[Dictionary] = []

          func _process(delta: float) -> void:
              for i in range(effects.size() - 1, -1, -1):
                  effects[i]["life"] = (
                      float(effects[i]["life"]) - delta
                  )

                  if float(effects[i]["life"]) <= 0.0:
                      effects.remove_at(i)

              queue_redraw()

          func create_slash(
              position: Vector2,
              direction: int
          ) -> void:
              effects.append({
                  "type": "slash",
                  "position": position,
                  "direction": direction,
                  "life": 0.2,
                  "max_life": 0.2
              })

          func create_burst(
              position: Vector2,
              radius: float
          ) -> void:
              effects.append({
                  "type": "burst",
                  "position": position,
                  "radius": radius,
                  "life": 0.35,
                  "max_life": 0.35
              })

          func _draw() -> void:
              for effect in effects:
                  var position: Vector2 = effect["position"]

                  var ratio := (
                      float(effect["life"]) /
                      float(effect["max_life"])
                  )

                  if effect["type"] == "slash":
                      var direction := int(
                          effect["direction"]
                      )

                      var start := Vector2(
                          0,
                          -10
                      )

                      var finish := Vector2(
                          24 * direction,
                          -25
                      )

                      draw_line(
                          position + start,
                          position + finish,
                          Color(
                              0.4,
                              0.85,
                              1.0,
                              ratio
                          ),
                          3.0
                      )

                  elif effect["type"] == "burst":
                      var radius := float(
                          effect["radius"]
                      )

                      draw_arc(
                          position,
                          radius * (1.0 - ratio),
                          0.0,
                          TAU,
                          20,
                          Color(
                              0.65,
                              0.3,
                              1.0,
                              ratio
                          ),
                          2.0
                      )
          EOF

