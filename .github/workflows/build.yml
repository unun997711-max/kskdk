
name: ILARION - Ultimate Android Game

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Select build configuration"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ilarion-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"
  ANDROID_API_LEVEL: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  JAVA_VERSION: "17"
  PROJECT_DIR: "ILARION"
  APK_NAME: "ILARION.apk"

jobs:

  build-android:

    name: ILARION Android Build

    runs-on: ubuntu-22.04

    timeout-minutes: 90

    steps:

      # ==========================================
      # 01 - SOURCE CONTROL
      # ==========================================

      - name: Checkout source repository
        uses: actions/checkout@v4

      # ==========================================
      # 02 - JAVA DEVELOPMENT KIT
      # ==========================================

      - name: Configure Java environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Verify Java installation
        shell: bash
        run: |
          set -e
          java -version
          javac -version

      # ==========================================
      # 03 - ANDROID SDK
      # ==========================================

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmdline-tools;latest"

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Installed platforms:"
          sdkmanager --list_installed

          echo "ADB version:"
          adb version

      # ==========================================
      # 04 - GODOT ENGINE
      # ==========================================

      - name: Download Godot engine
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/godot"
          cd "$HOME/godot"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64

          mv \
            Godot_v${GODOT_VERSION}-stable_linux.x86_64 \
            godot

          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Verify Godot engine
        shell: bash
        run: |
          set -e
          godot --version

      # ==========================================
      # 05 - ANDROID EXPORT TEMPLATES
      # ==========================================

      - name: Download Godot export templates
        shell: bash
        run: |
          set -e

          cd "$HOME/godot"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -O templates.tpz

          mkdir -p "$HOME/godot/templates"

          unzip -q templates.tpz -d "$HOME/godot/templates"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          cp -R "$HOME/godot/templates/templates/." "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      # ==========================================
      # 06 - PROJECT DIRECTORY STRUCTURE
      # ==========================================

      - name: Create ILARION directory structure
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR"

          mkdir -p "$PROJECT_DIR/scenes"
          mkdir -p "$PROJECT_DIR/scenes/menus"
          mkdir -p "$PROJECT_DIR/scenes/characters"
          mkdir -p "$PROJECT_DIR/scenes/enemies"
          mkdir -p "$PROJECT_DIR/scenes/bosses"
          mkdir -p "$PROJECT_DIR/scenes/world"
          mkdir -p "$PROJECT_DIR/scenes/story"

          mkdir -p "$PROJECT_DIR/scripts"
          mkdir -p "$PROJECT_DIR/scripts/core"
          mkdir -p "$PROJECT_DIR/scripts/player"
          mkdir -p "$PROJECT_DIR/scripts/combat"
          mkdir -p "$PROJECT_DIR/scripts/enemies"
          mkdir -p "$PROJECT_DIR/scripts/bosses"
          mkdir -p "$PROJECT_DIR/scripts/network"
          mkdir -p "$PROJECT_DIR/scripts/story"
          mkdir -p "$PROJECT_DIR/scripts/ui"
          mkdir -p "$PROJECT_DIR/scripts/save"

          mkdir -p "$PROJECT_DIR/assets"
          mkdir -p "$PROJECT_DIR/assets/sprites"
          mkdir -p "$PROJECT_DIR/assets/backgrounds"
          mkdir -p "$PROJECT_DIR/assets/effects"
          mkdir -p "$PROJECT_DIR/assets/audio"
          mkdir -p "$PROJECT_DIR/assets/fonts"

          mkdir -p "$PROJECT_DIR/data"
          mkdir -p "$PROJECT_DIR/data/characters"
          mkdir -p "$PROJECT_DIR/data/enemies"
          mkdir -p "$PROJECT_DIR/data/weapons"
          mkdir -p "$PROJECT_DIR/data/levels"
          mkdir -p "$PROJECT_DIR/data/dialogues"

          mkdir -p "$PROJECT_DIR/build"
          mkdir -p "$PROJECT_DIR/tests"

      # ==========================================
      # 07 - PROJECT CONFIGURATION
      # ==========================================

      - name: Generate Godot project configuration
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/project.godot" <<'EOF'
          config_version=5

          [application]

          config/name="ILARION"
          config/description="ILARION - The End of Creation"
          config/version="1.0.0"
          run/main_scene="res://scenes/main.tscn"

          [display]

          window/size/viewport_width=320
          window/size/viewport_height=180
          window/size/window_width_override=960
          window/size/window_height_override=540
          window/stretch/mode="viewport"
          window/stretch/aspect="expand"

          [rendering]

          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/default_filters/use_nearest_mipmap_filter=false
          textures/canvas_textures/default_texture_filter=0
          environment/defaults/default_clear_color=Color(0.025, 0.018, 0.045, 1)

          [physics]

          2d/default_gravity=980.0
          2d/default_gravity_vector=Vector2(0, 1)

          [audio]

          driver/enable_input=false

          [input]

          move_left={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":65)]
          }

          move_right={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":68)]
          }

          jump={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":32)]
          }

          attack={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":74)]
          }

          special_attack={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":75)]
          }

          interact={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":69)]
          }

          pause={
          "deadzone": 0.2,
          "events": [Object(InputEventKey,"physical_keycode":4194305)]
          }
          EOF

      # ==========================================
      # 08 - MAIN SCENE
      # ==========================================

      - name: Create main scene
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/scenes/main.tscn" <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://scripts/core/game_manager.gd" id="1"]

          [node name="ILARION" type="Node2D"]
          script = ExtResource("1")

          [node name="World" type="Node2D" parent="."]

          [node name="Characters" type="Node2D" parent="World"]

          [node name="Enemies" type="Node2D" parent="World"]

          [node name="Effects" type="Node2D" parent="World"]

          [node name="Camera" type="Camera2D" parent="World"]
          position_smoothing_enabled = true
          position_smoothing_speed = 5.0

          [node name="Interface" type="CanvasLayer" parent="."]

          [node name="HUD" type="Control" parent="Interface"]
          layout_mode = 3
          anchors_preset = 15
          anchor_right = 1.0
          anchor_bottom = 1.0
          grow_horizontal = 2
          grow_vertical = 2
          mouse_filter = 2
          EOF

      # ==========================================
      # 09 - INITIAL BUILD INFORMATION
      # ==========================================

      - name: Create project information
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/README.md" <<'EOF'
          # ILARION

          ILARION is a 2D pixel-art action adventure game.

          ## Game

          - Platform: Android
          - Engine: Godot
          - Rendering: 2D
          - Visual style: 16-bit pixel art
          - Internal resolution: 320x180

          ## Main characters

          - Levai
          - Aviane

          ## World

          - Forgotten Continents
          - Valdran
          - Novaria
          - Black Throne
          - Gate of Origin

          ## Build

          The GitHub Actions workflow builds the Android package.
          EOF

          echo "ILARION project foundation created."
          find "$PROJECT_DIR" -maxdepth 3 -type d | sort

      # ==========================================
      # 10 - PIXEL ART CHARACTER GENERATION
      # ==========================================

      - name: Generate ILARION character sprites
        shell: bash
        run: |
          set -e

          python3 -m pip install --quiet pillow

          cat > "$PROJECT_DIR/assets/generate_characters.py" <<'PY'
          from PIL import Image, ImageDraw
          import os

          OUT = "assets/sprites"
          os.makedirs(OUT, exist_ok=True)

          def draw_character(filename, palette, female=False):
              sheet = Image.new("RGBA", (64, 32), (0, 0, 0, 0))

              for frame in range(4):
                  d = ImageDraw.Draw(sheet)
                  x = frame * 16

                  bob = [0, 1, 0, -1][frame]
                  step = [0, 1, 2, 1][frame]

                  # Hair
                  d.rectangle(
                      (x+4, 1+bob, x+11, 8+bob),
                      fill=palette["hair"]
                  )

                  d.rectangle(
                      (x+5, 3+bob, x+10, 8+bob),
                      fill=palette["skin"]
                  )

                  # Eyes
                  d.point(
                      (x+9, 5+bob),
                      fill=palette["eye"]
                  )

                  # Neck
                  d.rectangle(
                      (x+7, 8+bob, x+9, 10+bob),
                      fill=palette["skin"]
                  )

                  # Armor / body
                  d.rectangle(
                      (x+4, 10+bob, x+11, 19+bob),
                      fill=palette["armor"]
                  )

                  d.rectangle(
                      (x+5, 11+bob, x+10, 17+bob),
                      fill=palette["armor_light"]
                  )

                  # Chest detail
                  d.rectangle(
                      (x+7, 12+bob, x+9, 15+bob),
                      fill=palette["detail"]
                  )

                  # Shoulder armor
                  d.rectangle(
                      (x+2, 10+bob, x+5, 13+bob),
                      fill=palette["armor_light"]
                  )

                  d.rectangle(
                      (x+10, 10+bob, x+13, 13+bob),
                      fill=palette["armor_light"]
                  )

                  # Arms
                  d.rectangle(
                      (x+2, 13+bob, x+4, 18+bob),
                      fill=palette["armor"]
                  )

                  d.rectangle(
                      (x+12, 13+bob, x+13, 18+bob),
                      fill=palette["armor"]
                  )

                  # Hands
                  d.rectangle(
                      (x+2, 18+bob, x+4, 19+bob),
                      fill=palette["skin"]
                  )

                  d.rectangle(
                      (x+12, 18+bob, x+13, 19+bob),
                      fill=palette["skin"]
                  )

                  # Legs
                  d.rectangle(
                      (x+5, 19+bob, x+7, 25+step+bob),
                      fill=palette["pants"]
                  )

                  d.rectangle(
                      (x+9, 19+bob, x+11, 25+(2-step)+bob),
                      fill=palette["pants"]
                  )

                  # Boots
                  d.rectangle(
                      (x+4, 26+step+bob, x+7, 28+step+bob),
                      fill=palette["boots"]
                  )

                  d.rectangle(
                      (x+9, 27+(2-step)+bob, x+12, 28+(2-step)+bob),
                      fill=palette["boots"]
                  )

                  # Female hair details
                  if female:
                      d.rectangle(
                          (x+3, 4+bob, x+5, 13+bob),
                          fill=palette["hair"]
                      )

                      d.rectangle(
                          (x+11, 4+bob, x+13, 13+bob),
                          fill=palette["hair"]
                      )

                      d.point(
                          (x+10, 7+bob),
                          fill=palette["detail"]
                      )

              sheet.save(os.path.join(OUT, filename))

          levai = {
              "hair": (235, 238, 255, 255),
              "skin": (220, 185, 170, 255),
              "eye": (80, 220, 255, 255),
              "armor": (35, 38, 58, 255),
              "armor_light": (90, 105, 135, 255),
              "detail": (110, 210, 245, 255),
              "pants": (35, 35, 52, 255),
              "boots": (20, 20, 30, 255)
          }

          aviane = {
              "hair": (130, 65, 175, 255),
              "skin": (245, 205, 195, 255),
              "eye": (160, 235, 255, 255),
              "armor": (65, 40, 95, 255),
              "armor_light": (155, 100, 190, 255),
              "detail": (245, 180, 245, 255),
              "pants": (55, 40, 80, 255),
              "boots": (35, 25, 50, 255)
          }

          draw_character("levai_idle.png", levai)
          draw_character("aviane_idle.png", aviane, True)

          # Create additional pixel-art effects.
          def make_effect(filename, color):
              img = Image.new("RGBA", (64, 32), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)

              for frame in range(4):
                  x = frame * 16
                  radius = 2 + frame

                  d.rectangle(
                      (x+8-radius, 16-radius, x+8+radius, 16+radius),
                      fill=color
                  )

                  d.point((x+8, 16), fill=(255, 255, 255, 255))

              img.save(os.path.join(OUT, filename))

          make_effect("void_slash.png", (80, 210, 255, 220))
          make_effect("magic_burst.png", (190, 90, 255, 220))

          print("ILARION character sprites generated.")
          PY

          cd "$PROJECT_DIR"
          python3 assets/generate_characters.py

      # ==========================================
      # 11 - PLAYER CHARACTER SCRIPT
      # ==========================================

      - name: Create Levai character controller
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/scripts/player/player.gd" <<'EOF'
          extends CharacterBody2D

          signal health_changed(value: int)
          signal attack_started
          signal character_defeated

          @export var character_name: String = "Levai"
          @export var character_texture: Texture2D
          @export var is_companion: bool = false

          const WALK_SPEED: float = 90.0
          const RUN_SPEED: float = 130.0
          const JUMP_FORCE: float = -270.0
          const GRAVITY: float = 750.0

          const FRAME_WIDTH: int = 16
          const FRAME_HEIGHT: int = 32
          const FRAME_COUNT: int = 4

          var health: int = 100
          var max_health: int = 100
          var energy: int = 100

          var facing: int = 1
          var animation_frame: int = 0
          var animation_timer: float = 0.0

          var attack_timer: float = 0.0
          var invulnerability_timer: float = 0.0
          var hit_flash_timer: float = 0.0

          var defeated: bool = false
          var attacking: bool = false
          var companion_target: Node2D

          @onready var sprite: Sprite2D = $Sprite

          func _ready() -> void:
              add_to_group("players")

              if character_texture != null:
                  sprite.texture = character_texture

              sprite.region_enabled = true
              sprite.region_rect = Rect2(
                  0,
                  0,
                  FRAME_WIDTH,
                  FRAME_HEIGHT
              )

              sprite.texture_filter = CanvasItem.TEXTURE_FILTER_NEAREST

              health = max_health

              if is_companion:
                  companion_target = get_parent().get_node_or_null("Levai")

          func _physics_process(delta: float) -> void:
              if defeated:
                  return

              update_timers(delta)

              if is_companion:
                  update_companion(delta)
              else:
                  update_player_input(delta)

              apply_gravity(delta)
              move_and_slide()
              update_animation(delta)

          func update_timers(delta: float) -> void:
              attack_timer = maxf(0.0, attack_timer - delta)
              invulnerability_timer = maxf(
                  0.0,
                  invulnerability_timer - delta
              )

              hit_flash_timer = maxf(
                  0.0,
                  hit_flash_timer - delta
              )

          func update_player_input(delta: float) -> void:
              var direction := Input.get_axis(
                  "move_left",
                  "move_right"
              )

              if direction != 0.0:
                  facing = 1 if direction > 0 else -1

              var current_speed := WALK_SPEED

              velocity.x = direction * current_speed

              if Input.is_action_just_pressed("jump"):
                  if is_on_floor():
                      velocity.y = JUMP_FORCE

              if Input.is_action_just_pressed("attack"):
                  attack()

              if Input.is_action_just_pressed("special_attack"):
                  special_attack()

          func update_companion(delta: float) -> void:
              if not is_instance_valid(companion_target):
                  velocity.x = move_toward(
                      velocity.x,
                      0.0,
                      WALK_SPEED * delta
                  )
                  return

              var distance := (
                  companion_target.global_position.x -
                  global_position.x
              )

              if absf(distance) > 28.0:
                  var direction := signf(distance)

                  velocity.x = direction * WALK_SPEED * 0.75
                  facing = 1 if direction > 0 else -1
              else:
                  velocity.x = move_toward(
                      velocity.x,
                      0.0,
                      WALK_SPEED * delta * 3.0
                  )

              if absf(distance) > 85.0:
                  global_position.x = companion_target.global_position.x - (
                      facing * 45.0
                  )

          func apply_gravity(delta: float) -> void:
              if not is_on_floor():
                  velocity.y += GRAVITY * delta
              elif velocity.y > 0.0:
                  velocity.y = 0.0

          func attack() -> void:
              if attack_timer > 0.0:
                  return

              attack_timer = 0.35
              attacking = true

              attack_started.emit()

              var attack_position := global_position
              attack_position.x += facing * 25.0

              var enemies := get_tree().get_nodes_in_group("enemies")

              for enemy in enemies:
                  if not is_instance_valid(enemy):
                      continue

                  var distance := (
                      enemy.global_position - attack_position
                  ).length()

                  if distance <= 30.0:
                      if enemy.has_method("take_damage"):
                          enemy.take_damage(25)

          func special_attack() -> void:
              if energy < 25:
                  return

              energy -= 25

              var enemies := get_tree().get_nodes_in_group("enemies")

              for enemy in enemies:
                  if not is_instance_valid(enemy):
                      continue

                  var distance := (
                      enemy.global_position - global_position
                  ).length()

                  if distance <= 75.0:
                      if enemy.has_method("take_damage"):
                          enemy.take_damage(45)

          func take_damage(amount: int) -> void:
              if defeated:
                  return

              if invulnerability_timer > 0.0:
                  return

              health = maxi(0, health - amount)
              invulnerability_timer = 0.7
              hit_flash_timer = 0.15

              health_changed.emit(health)

              if health <= 0:
                  defeat()

          func heal(amount: int) -> void:
              if defeated:
                  return

              health = mini(max_health, health + amount)
              health_changed.emit(health)

          func restore_energy(amount: int) -> void:
              energy = mini(100, energy + amount)

          func defeat() -> void:
              defeated = true
              velocity = Vector2.ZERO
              character_defeated.emit()

          func revive() -> void:
              defeated = false
              health = max_health
              energy = 100
              invulnerability_timer = 2.0

              health_changed.emit(health)

          func update_animation(delta: float) -> void:
              animation_timer += delta

              if animation_timer >= 0.12:
                  animation_timer = 0.0
                  animation_frame = (
                      animation_frame + 1
                  ) % FRAME_COUNT

              if absf(velocity.x) > 5.0:
                  sprite.region_rect.position.x = (
                      animation_frame * FRAME_WIDTH
                  )
              else:
                  sprite.region_rect.position.x = 0

              sprite.flip_h = facing < 0

              if hit_flash_timer > 0.0:
                  sprite.modulate = Color(1.0, 0.45, 0.45)
              else:
                  sprite.modulate = Color.WHITE

              if attacking:
                  attacking = false

          func get_health_ratio() -> float:
              return float(health) / float(max_health)

          func get_energy_ratio() -> float:
              return float(energy) / 100.0
          EOF

      # ==========================================
      # 12 - LEVAI CHARACTER SCENE
      # ==========================================

      - name: Create Levai character scene
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/scenes/characters/levai.tscn" <<'EOF'
          [gd_scene load_steps=4 format=3]

          [ext_resource type="Script" path="res://scripts/player/player.gd" id="1"]

          [ext_resource type="Texture2D" path="res://assets/sprites/levai_idle.png" id="2"]

          [sub_resource type="RectangleShape2D" id="BodyShape"]
          size = Vector2(10, 22)

          [node name="Levai" type="CharacterBody2D"]
          collision_layer = 2
          collision_mask = 1
          script = ExtResource("1")
          character_name = "Levai"
          character_texture = ExtResource("2")

          [node name="Sprite" type="Sprite2D" parent="."]
          position = Vector2(0, -16)
          texture_filter = 1
          texture = ExtResource("2")
          region_enabled = true
          region_rect = Rect2(0, 0, 16, 32)

          [node name="CollisionShape2D" type="CollisionShape2D" parent="."]
          position = Vector2(0, -11)
          shape = SubResource("BodyShape")
          EOF

      # ==========================================
      # 13 - AVIANE CHARACTER SCENE
      # ==========================================

      - name: Create Aviane character scene
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/scenes/characters/aviane.tscn" <<'EOF'
          [gd_scene load_steps=4 format=3]

          [ext_resource type="Script" path="res://scripts/player/player.gd" id="1"]

          [ext_resource type="Texture2D" path="res://assets/sprites/aviane_idle.png" id="2"]

          [sub_resource type="RectangleShape2D" id="BodyShape"]
          size = Vector2(10, 22)

          [node name="Aviane" type="CharacterBody2D"]
          collision_layer = 2
          collision_mask = 1
          script = ExtResource("1")
          character_name = "Aviane"
          character_texture = ExtResource("2")
          is_companion = true

          [node name="Sprite" type="Sprite2D" parent="."]
          position = Vector2(0, -16)
          texture_filter = 1
          texture = ExtResource("2")
          region_enabled = true
          region_rect = Rect2(0, 0, 16, 32)

          [node name="CollisionShape2D" type="CollisionShape2D" parent="."]
          position = Vector2(0, -11)
          shape = SubResource("BodyShape")
          EOF

      # ==========================================
      # 14 - GAME MANAGER
      # ==========================================

      - name: Create game manager
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/scripts/core/game_manager.gd" <<'EOF'
          extends Node2D

          signal game_started
          signal game_paused
          signal game_resumed
          signal chapter_changed(chapter: int)

          const LEVAI_SCENE = preload(
              "res://scenes/characters/levai.tscn"
          )

          const AVIANE_SCENE = preload(
              "res://scenes/characters/aviane.tscn"
          )

          var current_chapter: int = 1
          var game_time: float = 0.0

          var game_is_running: bool = false
          var game_is_paused: bool = false

          var levai: CharacterBody2D
          var aviane: CharacterBody2D

          @onready var world: Node2D = $World
          @onready var characters: Node2D = $World/Characters
          @onready var camera: Camera2D = $World/Camera

          func _ready() -> void:
              create_main_characters()
              setup_camera()
              game_is_running = true
              game_started.emit()

          func create_main_characters() -> void:
              levai = LEVAI_SCENE.instantiate()
              levai.name = "Levai"

              characters.add_child(levai)
              levai.position = Vector2(70, 120)

              aviane = AVIANE_SCENE.instantiate()
              aviane.name = "Aviane"

              characters.add_child(aviane)
              aviane.position = Vector2(35, 120)

          func setup_camera() -> void:
              camera.enabled = true
              camera.make_current()

              if is_instance_valid(levai):
                  camera.global_position = levai.global_position

          func _process(delta: float) -> void:
              if not game_is_running:
                  return

              if game_is_paused:
                  return

              game_time += delta

              update_camera(delta)

          func update_camera(delta: float) -> void:
              if not is_instance_valid(levai):
                  return

              var target := levai.global_position
              target.y -= 25.0

              camera.global_position = camera.global_position.lerp(
                  target,
                  clampf(delta * 5.0, 0.0, 1.0)
              )

          func pause_game() -> void:
              if game_is_paused:
                  return

              game_is_paused = true
              get_tree().paused = true
              game_paused.emit()

          func resume_game() -> void:
              if not game_is_paused:
                  return

              get_tree().paused = false
              game_is_paused = false
              game_resumed.emit()

          func advance_chapter() -> void:
              current_chapter += 1
              chapter_changed.emit(current_chapter)

          func get_chapter() -> int:
              return current_chapter

          func get_game_time() -> float:
              return game_time

          func get_levai() -> CharacterBody2D:
              return levai

          func get_aviane() -> CharacterBody2D:
              return aviane
          EOF

