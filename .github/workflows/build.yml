      - name: Create world transition gates
        shell: bash
        run: |
          cat > "$PROJECT_DIR/scripts/world/region_gate.gd" <<'GD'
          extends Area2D
          class_name RegionGate

          signal gate_used(destination: String)

          @export var destination_region: String = "valdran"
          @export var required_level: int = 1
          @export var gate_label: String = "Continue"

          var player_nearby: bool = false
          var locked: bool = false

          func _ready() -> void:
              body_entered.connect(_on_body_entered)
              body_exited.connect(_on_body_exited)

          func _on_body_entered(body: Node2D) -> void:
              if body.is_in_group("players"):
                  player_nearby = true

          func _on_body_exited(body: Node2D) -> void:
              if body.is_in_group("players"):
                  player_nearby = false

          func interact() -> bool:
              if not player_nearby or locked:
                  return false
              var progression := get_tree().get_first_node_in_group("level_progression")
              if progression != null and progression.level < required_level:
                  locked = true
                  return false
              var world := get_tree().get_first_node_in_group("world_manager")
              if world == null:
                  return false
              var success: bool = world.enter_region(destination_region)
              if success:
                  gate_used.emit(destination_region)
              return success

          func unlock_gate() -> void:
              locked = false
          GD

