          make_enemy("night_reaper", ((35, 55, 80, 255),
                                      (15, 25, 45, 255),
                                      (80, 220, 255, 255),
                                      (5, 10, 20, 255)))
          make_enemy("morganth", ((100, 20, 35, 255),
                                  (45, 5, 20, 255),
                                  (255, 210, 110, 255),
                                  (15, 0, 10, 255)), 48, True)
          print("Enemy pixel-art sheets generated.")
          PY
          cd "$PROJECT_DIR"
          python3 assets/generate_enemies.py

      - name: Create enemy AI controller
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/scripts/enemies"
          cat > "$PROJECT_DIR/scripts/enemies/enemy.gd" <<'GD'
          extends CharacterBody2D

          signal health_changed(current: float, maximum: float)
          signal enemy_defeated(enemy: Node)

          @export var enemy_name: String = "Ash Wolf"
          @export var max_health: float = 60.0
          @export var move_speed: float = 65.0
          @export var attack_damage: float = 8.0
          @export var attack_range: float = 25.0
          @export var detection_range: float = 190.0
          @export var attack_cooldown: float = 1.4
          @export var experience_reward: int = 12
          @export var enemy_kind: String = "ash_wolf"

          var health: float = 60.0
          var target: Node2D
          var attack_timer: float = 0.0
          var hit_stun: float = 0.0
          var facing: float = 1.0
          var defeated: bool = false
          var ai_enabled: bool = true
          var wander_timer: float = 0.0
          var wander_direction: Vector2 = Vector2.ZERO

          @onready var sprite: Sprite2D = $Sprite2D

          func _ready() -> void:
              add_to_group("enemies")
              health = max_health
              _find_target()
              _load_enemy_texture()
              health_changed.emit(health, max_health)

          func _physics_process(delta: float) -> void:
              if defeated:
                  return
              attack_timer = maxf(0.0, attack_timer - delta)
              hit_stun = maxf(0.0, hit_stun - delta)
              if not ai_enabled or hit_stun > 0.0:
                  velocity = velocity.move_toward(Vector2.ZERO, 500.0 * delta)
                  move_and_slide()
                  return
              if not is_instance_valid(target):
                  _find_target()
              if is_instance_valid(target):
                  _update_combat_ai(delta)
              else:
                  _wander(delta)
              move_and_slide()

          func _find_target() -> void:
              var candidates := get_tree().get_nodes_in_group("players")
              if candidates.size() > 0:
                  target = candidates[0] as Node2D
                  return
              var root := get_tree().current_scene
              if root != null:
                  var found := root.find_child("Levai", true, false)
                  if found is Node2D:
                      target = found

          func _update_combat_ai(delta: float) -> void:
              var distance := global_position.distance_to(target.global_position)
              if distance > detection_range:
                  _wander(delta)
                  return
              var direction := global_position.direction_to(target.global_position)
              if absf(direction.x) > 0.05:
                  facing = signf(direction.x)
                  sprite.flip_h = facing < 0.0
              if distance > attack_range:
                  velocity = direction * move_speed
              else:
                  velocity = velocity.move_toward(Vector2.ZERO, 600.0 * delta)
                  if attack_timer <= 0.0:
                      _perform_attack()

          func _perform_attack() -> void:
              attack_timer = attack_cooldown
              if not is_instance_valid(target):
                  return
              if global_position.distance_to(target.global_position) > attack_range + 8.0:
                  return
              if target.has_method("take_damage"):
                  target.take_damage(attack_damage, self)
              elif target.has_method("receive_damage"):
                  target.receive_damage(attack_damage)

          func _wander(delta: float) -> void:
              wander_timer -= delta
              if wander_timer <= 0.0:
                  wander_timer = randf_range(1.0, 3.0)
                  wander_direction = Vector2(
                      randf_range(-1.0, 1.0),
                      randf_range(-0.25, 0.25)
                  ).normalized()
              velocity = wander_direction * move_speed * 0.28

          func take_damage(amount: float, attacker: Node = null) -> void:
              if defeated or amount <= 0.0:
                  return
              health = maxf(0.0, health - amount)
              hit_stun = 0.16
              health_changed.emit(health, max_health)
              if attacker is Node2D:
                  var knockback := global_position.direction_to(
                      attacker.global_position
                  )
                  velocity = -knockback * 95.0
              if health <= 0.0:
                  die()

          func die() -> void:
              if defeated:
                  return
              defeated = true
              enemy_defeated.emit(self)
              if get_tree().get_first_node_in_group("game_manager") != null:
                  var manager := get_tree().get_first_node_in_group("game_manager")
                  if manager.has_method("award_experience"):
                      manager.award_experience(experience_reward)
              queue_free()

          func is_defeated() -> bool:
              return defeated

          func set_target(new_target: Node2D) -> void:
              target = new_target

          func set_difficulty(multiplier: float) -> void:
              var scale_value := maxf(0.25, multiplier)
              max_health *= scale_value
              health = max_health
              attack_damage *= scale_value
              move_speed *= minf(1.6, 1.0 + (scale_value - 1.0) * 0.2)

          func _load_enemy_texture() -> void:
              var path := "res://assets/sprites/enemies/" + enemy_kind + ".png"
              if ResourceLoader.exists(path):
                  var texture := load(path) as Texture2D
                  if texture != null:
                      sprite.texture = texture
                      sprite.hframes = 4
                      sprite.vframes = 1
                      sprite.frame = 0
          GD

