              for child in quest_list.get_children():
                  child.queue_free()
              if manager == null:
                  manager = get_tree().get_first_node_in_group("quest_manager")
              if manager == null:
                  return
              for quest_id in manager.get_active_quest_ids():
                  var state: Dictionary = manager.get_quest_progress(quest_id)
                  var data: Dictionary = state.get("data", {})
                  var button := Button.new()
                  button.text = str(data.get("title", quest_id))
                  button.pressed.connect(
                      _show_quest_details.bind(quest_id)
                  )
                  quest_list.add_child(button)

          func _show_quest_details(quest_id: String) -> void:
              var state: Dictionary = manager.get_quest_progress(quest_id)
              if state.is_empty():
                  return
              var data: Dictionary = state.get("data", {})
              var objectives: Array = data.get("objectives", [])
              var progress := int(state.get("progress", 0))
              var lines := []
              for i in range(objectives.size()):
                  var prefix := "[✓] " if i < progress else "[ ] "
                  lines.append(prefix + str(objectives[i]))
              details_label.text = "\n".join(lines)
          GD

      - name: Create cinematic scene controller
        shell: bash
        run: |
          cat > "$PROJECT_DIR/scripts/ui/cinematic_controller.gd" <<'GD'
          extends CanvasLayer
          class_name CinematicController

          signal cinematic_started(scene_id: String)
          signal cinematic_finished(scene_id: String)

          var scene_id: String = ""
          var active: bool = false
          var sequence: Array = []
          var index: int = 0
          var timer: float = 0.0
          var fade_rect: ColorRect
          var caption: Label

          func _ready() -> void:
              _build_cinematic_ui()

          func _build_cinematic_ui() -> void:
              fade_rect = ColorRect.new()
              fade_rect.color = Color(0, 0, 0, 0)
              fade_rect.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
              fade_rect.mouse_filter = Control.MOUSE_FILTER_IGNORE
              add_child(fade_rect)

              caption = Label.new()
              caption.anchor_left = 0.1
              caption.anchor_right = 0.9
              caption.anchor_top = 0.78
              caption.anchor_bottom = 0.94
              caption.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              caption.vertical_alignment = VERTICAL_ALIGNMENT_CENTER
              caption.autowrap_mode = TextServer.AUTOWRAP_WORD_SMART
              caption.add_theme_color_override(
                  "font_color", ILARIONTheme.COLORS["text"]
              )
              caption.add_theme_font_size_override("font_size", 16)
              add_child(caption)

          func play_sequence(id: String, events: Array) -> void:
              if active:
                  return
              scene_id = id
              sequence = events.duplicate(true)
              index = 0
              active = true
              timer = 0.0
              cinematic_started.emit(scene_id)
              _play_current_event()

          func _play_current_event() -> void:
              if index >= sequence.size():
                  finish_sequence()
                  return
              var event: Dictionary = sequence[index]
              var event_type := str(event.get("type", "caption"))
              match event_type:
                  "caption":
                      caption.text = str(event.get("text", ""))
                      timer = float(event.get("duration", 2.0))
                  "fade_out":
                      fade_rect.color = Color(0, 0, 0, 1)
                      timer = float(event.get("duration", 1.0))
                  "fade_in":
                      fade_rect.color = Color(0, 0, 0, 0)
                      timer = float(event.get("duration", 1.0))
                  "wait":
                      timer = float(event.get("duration", 1.0))
                  _:
                      timer = 0.5

          func _process(delta: float) -> void:
              if not active:
                  return
              timer -= delta
              if timer <= 0.0:
                  index += 1
                  _play_current_event()

          func skip_sequence() -> void:
              if active:
                  finish_sequence()

          func finish_sequence() -> void:
              active = false
              caption.text = ""
              fade_rect.color = Color(0, 0, 0, 0)
              cinematic_finished.emit(scene_id)
              sequence.clear()
          GD

