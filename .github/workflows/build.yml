      - name: ILARION - Create LAN Room System
        shell: bash
        run: |
          mkdir -p ILARION/scripts/network
          mkdir -p ILARION/scripts/ui

          cat > ILARION/scripts/network/room_network.gd <<'EOF'
          extends Node

          signal status_changed(message: String)
          signal players_changed(players: Array)

          const PORT := 7777
          const MAX_PLAYERS := 4

          var peer: ENetMultiplayerPeer
          var is_host := false
          var room_code := ""
          var connected_players: Array[int] = []

          func _ready() -> void:
              multiplayer.peer_connected.connect(_on_peer_connected)
              multiplayer.peer_disconnected.connect(_on_peer_disconnected)
              multiplayer.connected_to_server.connect(_on_connected)
              multiplayer.connection_failed.connect(_on_connection_failed)
              multiplayer.server_disconnected.connect(_on_server_disconnected)

          func create_room() -> String:
              close_room()

              peer = ENetMultiplayerPeer.new()
              var error := peer.create_server(PORT, MAX_PLAYERS - 1)

              if error != OK:
                  status_changed.emit("تعذر إنشاء الغرفة. رمز الخطأ: %s" % error)
                  return ""

              multiplayer.multiplayer_peer = peer
              is_host = true
              connected_players.clear()
              connected_players.append(1)

              var address := _get_local_ip()
              if address.is_empty():
                  close_room()
                  status_changed.emit("لم يتم العثور على عنوان شبكة محلية")
                  return ""

              room_code = "%s:%d" % [address, PORT]
              status_changed.emit("تم إنشاء الغرفة بنجاح")
              _emit_players()
              return room_code

          func join_room(code: String) -> bool:
              close_room()

              var clean_code := code.strip_edges()
              var parts := clean_code.split(":")

              if parts.size() != 2:
                  status_changed.emit("صيغة رمز الغرفة غير صحيحة")
                  return false

              var address := parts[0].strip_edges()
              var port := parts[1].to_int()

              if address.is_empty() or port < 1 or port > 65535:
                  status_changed.emit("عنوان الغرفة أو المنفذ غير صحيح")
                  return false

              peer = ENetMultiplayerPeer.new()
              var error := peer.create_client(address, port)

              if error != OK:
                  status_changed.emit("تعذر الاتصال بالغرفة")
                  return false

              multiplayer.multiplayer_peer = peer
              is_host = false
              room_code = clean_code
              connected_players.clear()
              status_changed.emit("جارٍ الاتصال بالغرفة...")
              return true

          func close_room() -> void:
              if peer != null:
                  peer.close()
              multiplayer.multiplayer_peer = null
              peer = null
              is_host = false
              room_code = ""
              connected_players.clear()
              _emit_players()

          func _get_local_ip() -> String:
              for address in IP.get_local_addresses():
                  if address.begins_with("192.168.") \
                  or address.begins_with("10.") \
                  or address.begins_with("172."):
                      if not address.ends_with(".1"):
                          return address
              return ""

          func _on_peer_connected(id: int) -> void:
              if not connected_players.has(id):
                  connected_players.append(id)
              status_changed.emit("انضم لاعب جديد: %d" % id)
              _emit_players()

          func _on_peer_disconnected(id: int) -> void:
              connected_players.erase(id)
              status_changed.emit("غادر اللاعب: %d" % id)
              _emit_players()

          func _on_connected() -> void:
              status_changed.emit("تم الاتصال بالغرفة بنجاح")
              connected_players.append(multiplayer.get_unique_id())
              _emit_players()

          func _on_connection_failed() -> void:
              status_changed.emit("فشل الاتصال. تحقق من الرمز وشبكة Wi-Fi")
              close_room()

          func _on_server_disconnected() -> void:
              status_changed.emit("انقطع الاتصال بالمضيف")
              close_room()

          func _emit_players() -> void:
              players_changed.emit(connected_players.duplicate())

          func get_player_count() -> int:
              return connected_players.size()
          EOF

