          var speaker_label: Label
          var dialogue_label: Label
          var continue_label: Label

          func _ready() -> void:
              _build_interface()
              visible = false
              set_process(true)

          func _build_interface() -> void:
              set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
              panel = PanelContainer.new()
              panel.anchor_left = 0.08
              panel.anchor_right = 0.92
              panel.anchor_top = 0.70
              panel.anchor_bottom = 0.96
              panel.add_theme_stylebox_override(
                  "panel", ILARIONTheme.make_panel_style()
              )
              add_child(panel)

              var layout := VBoxContainer.new()
              layout.add_theme_constant_override("separation", 5)
              panel.add_child(layout)

              speaker_label = Label.new()
              speaker_label.add_theme_color_override(
                  "font_color", ILARIONTheme.COLORS["gold"]
              )
              speaker_label.add_theme_font_size_override("font_size", 16)
              speaker_label.horizontal_alignment = HORIZONTAL_ALIGNMENT_RIGHT
              layout.add_child(speaker_label)

              dialogue_label = Label.new()
              dialogue_label.autowrap_mode = TextServer.AUTOWRAP_WORD_SMART
              dialogue_label.horizontal_alignment = HORIZONTAL_ALIGNMENT_RIGHT
              dialogue_label.add_theme_color_override(
                  "font_color", ILARIONTheme.COLORS["text"]
              )
              dialogue_label.add_theme_font_size_override("font_size", 13)
              dialogue_label.custom_minimum_size = Vector2(0, 45)
              layout.add_child(dialogue_label)

              continue_label = Label.new()
              continue_label.text = "اضغط للتكملة ▼"
              continue_label.horizontal_alignment = HORIZONTAL_ALIGNMENT_LEFT
              continue_label.add_theme_color_override(
                  "font_color", ILARIONTheme.COLORS["gold"]
              )
              layout.add_child(continue_label)

          func start_dialogue(lines: Array) -> void:
              if lines.is_empty():
                  dialogue_finished.emit()
                  return
              dialogue_lines = lines.duplicate(true)
              current_line = 0
              active = true
              visible = true
              _show_current_line()

          func _show_current_line() -> void:
              if current_line >= dialogue_lines.size():
                  finish_dialogue()
                  return
              var line: Dictionary = dialogue_lines[current_line]
              speaker_label.text = str(line.get("speaker", ""))
              full_text = str(line.get("text", ""))
              visible_characters = 0
              dialogue_label.text = full_text
              dialogue_label.visible_characters = 0
              typing = true
              type_timer = 0.0
              line_started.emit(speaker_label.text, current_line)

          func _process(delta: float) -> void:
              if not active or not typing:
                  return
              type_timer += delta * characters_per_second
              var target_count := int(type_timer)
              visible_characters = mini(target_count, full_text.length())
              dialogue_label.visible_characters = visible_characters
              if visible_characters >= full_text.length():
                  typing = false

          func advance() -> void:
              if not active:
                  return
              if typing:
                  typing = false
                  dialogue_label.visible_characters = -1
                  return
              current_line += 1
              _show_current_line()

          func finish_dialogue() -> void:
              active = false
              typing = false
              visible = false
              dialogue_lines.clear()
              dialogue_finished.emit()

          func _unhandled_input(event: InputEvent) -> void:
              if not active:
                  return
              if event.is_action_pressed("ui_accept"):
                  advance()
                  get_viewport().set_input_as_handled()
              elif event is InputEventScreenTouch and event.pressed:
                  advance()
                  get_viewport().set_input_as_handled()
          GD

