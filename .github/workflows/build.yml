      - name: Create quest manager
        shell: bash
        run: |
          cat > "$PROJECT_DIR/scripts/ui/quest_manager.gd" <<'GD'
          extends Node
          class_name QuestManager

          signal quest_started(quest_id: String)
          signal objective_updated(quest_id: String, objective_index: int)
          signal quest_completed(quest_id: String)
          signal quest_failed(quest_id: String)

          var active_quests: Dictionary = {}
          var completed_quests: Array[String] = []
          var failed_quests: Array[String] = []

          func _ready() -> void:
              add_to_group("quest_manager")

          func start_quest(quest_id: String) -> bool:
              if active_quests.has(quest_id):
                  return false
              if completed_quests.has(quest_id):
                  return false
              var data := QuestDatabase.get_quest(quest_id)
              if data.is_empty():
                  return false
              active_quests[quest_id] = {
                  "data": data,
                  "progress": 0,
                  "started": true
              }
              quest_started.emit(quest_id)
              return true

          func advance_objective(quest_id: String) -> bool:
              if not active_quests.has(quest_id):
                  return false
              var state: Dictionary = active_quests[quest_id]
              var objectives: Array = state["data"].get("objectives", [])
              state["progress"] = int(state["progress"]) + 1
              active_quests[quest_id] = state
              objective_updated.emit(quest_id, int(state["progress"]))
              if int(state["progress"]) >= objectives.size():
                  complete_quest(quest_id)
              return true

          func complete_quest(quest_id: String) -> bool:
              if not active_quests.has(quest_id):
                  return false
              var state: Dictionary = active_quests[quest_id]
              var reward: Dictionary = state["data"]
              var manager := get_tree().get_first_node_in_group("game_manager")
              if manager != null:
                  if manager.has_method("add_gold"):
                      manager.add_gold(int(reward.get("gold", 0)))
                  if manager.has_method("award_experience"):
                      manager.award_experience(int(reward.get("experience", 0)))
              active_quests.erase(quest_id)
              completed_quests.append(quest_id)
              quest_completed.emit(quest_id)
              return true

          func fail_quest(quest_id: String) -> bool:
              if not active_quests.has(quest_id):
                  return false
              active_quests.erase(quest_id)
              failed_quests.append(quest_id)
              quest_failed.emit(quest_id)
              return true

          func get_active_quest_ids() -> Array:
              return active_quests.keys()

          func get_quest_progress(quest_id: String) -> Dictionary:
              if not active_quests.has(quest_id):
                  return {}
              return active_quests[quest_id].duplicate(true)

          func is_quest_completed(quest_id: String) -> bool:
              return completed_quests.has(quest_id)
          GD

