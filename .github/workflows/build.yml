      - name: Create Morganth boss AI and phases
        shell: bash
        run: |
          cat > "$PROJECT_DIR/scripts/enemies/morganth.gd" <<'GD'
          extends "res://scripts/enemies/enemy.gd"

          signal phase_changed(phase: int)
          signal boss_skill_used(skill_name: String)

          var boss_phase: int = 1
          var special_timer: float = 5.0
          var enraged: bool = false
          var phase_two_threshold: float = 0.65
          var phase_three_threshold: float = 0.30
          var special_index: int = 0
          var boss_intro_finished: bool = false

          func _ready() -> void:
              enemy_name = "Morganth"
              enemy_kind = "morganth"
              max_health = 1800.0
              move_speed = 42.0
              attack_damage = 28.0
              attack_range = 48.0
              detection_range = 650.0
              attack_cooldown = 1.65
              experience_reward = 500
              super._ready()
              _start_boss_intro()

          func _physics_process(delta: float) -> void:
              if defeated:
                  return
              special_timer -= delta
              _check_phase_transition()
              super._physics_process(delta)
              if special_timer <= 0.0 and is_instance_valid(target):
                  _use_special_attack()

          func _start_boss_intro() -> void:
              boss_intro_finished = true
              boss_skill_used.emit("boss_awakening")

          func _check_phase_transition() -> void:
              var ratio := health / maxf(1.0, max_health)
              if boss_phase == 1 and ratio <= phase_two_threshold:
                  boss_phase = 2
                  move_speed = 55.0
                  attack_damage = 36.0
                  attack_cooldown = 1.3
                  phase_changed.emit(boss_phase)
              elif boss_phase == 2 and ratio <= phase_three_threshold:
                  boss_phase = 3
                  enraged = true
                  move_speed = 72.0
                  attack_damage = 48.0
                  attack_cooldown = 0.95
                  special_timer = 1.5
                  phase_changed.emit(boss_phase)

          func _use_special_attack() -> void:
              if not is_instance_valid(target):
                  special_timer = 2.0
                  return
              special_index = (special_index + 1) % 3
              if boss_phase == 1:
                  _void_burst()
                  special_timer = 6.0
              elif boss_phase == 2:
                  if special_index == 0:
                      _void_burst()
                  else:
                      _shadow_charge()
                  special_timer = 4.2
              else:
                  if special_index == 0:
                      _void_burst()
                  elif special_index == 1:
                      _shadow_charge()
                  else:
                      _final_pulse()
                  special_timer = 2.8

          func _void_burst() -> void:
              boss_skill_used.emit("void_burst")
              var distance := global_position.distance_to(target.global_position)
              if distance <= 150.0 and target.has_method("take_damage"):
                  target.take_damage(attack_damage * 1.35, self)

          func _shadow_charge() -> void:
              boss_skill_used.emit("shadow_charge")
              var direction := global_position.direction_to(target.global_position)
              velocity = direction * (move_speed * 3.0)
              if global_position.distance_to(target.global_position) < 190.0:
                  if target.has_method("take_damage"):
                      target.take_damage(attack_damage * 1.6, self)

          func _final_pulse() -> void:
              boss_skill_used.emit("final_pulse")
              var distance := global_position.distance_to(target.global_position)
              if distance <= 230.0 and target.has_method("take_damage"):
                  target.take_damage(attack_damage * 2.0, self)

          func take_damage(amount: float, attacker: Node = null) -> void:
              super.take_damage(amount, attacker)
              if not defeated:
                  _check_phase_transition()

          func die() -> void:
              if defeated:
                  return
              boss_skill_used.emit("morganth_defeated")
              super.die()
          GD

      - name: Create enemy wave director
        shell: bash
        run: |
          cat > "$PROJECT_DIR/scripts/enemies/enemy_director.gd" <<'GD'
          extends Node2D

          signal wave_started(wave_number: int)
          signal wave_completed(wave_number: int)
          signal boss_spawned(boss: Node)
          signal all_waves_completed()

          const ENEMY_SCENE = preload("res://scenes/enemies/enemy.tscn")
          const BOSS_SCENE = preload("res://scenes/enemies/boss.tscn")

          @export var spawn_radius: float = 190.0
          @export var base_enemy_count: int = 3
          @export var maximum_wave: int = 8

          var current_wave: int = 0
          var active_enemies: Array[Node] = []
          var wave_running: bool = false
          var boss_active: bool = false
          var spawn_random := RandomNumberGenerator.new()

          func _ready() -> void:
              spawn_random.randomize()
              add_to_group("enemy_director")

          func start_next_wave() -> void:
              if wave_running or boss_active:
                  return
              if current_wave >= maximum_wave:
                  all_waves_completed.emit()
                  return
              current_wave += 1
              wave_running = true
              wave_started.emit(current_wave)
              var count := base_enemy_count + current_wave
              var difficulty := 1.0 + float(current_wave - 1) * 0.22
              for index in range(count):
                  _spawn_enemy(difficulty, index)
              _clean_enemy_list()

          func _spawn_enemy(difficulty: float, index: int) -> void:
              var enemy := ENEMY_SCENE.instantiate()
              if enemy == null:
                  return
              var types := [
                  "ash_wolf",
                  "void_crawler",
                  "fallen_knight",
                  "night_reaper"
              ]
              var chosen := types[spawn_random.randi_range(0, types.size()-1)]
              enemy.enemy_kind = chosen
              enemy.enemy_name = chosen.replace("_", " ").capitalize()
              enemy.set_difficulty(difficulty)
              var angle := TAU * float(index) / maxf(1.0, float(base_enemy_count + current_wave))
              var offset := Vector2(cos(angle), sin(angle)) * spawn_radius
              enemy.position = offset
              add_child(enemy)
              active_enemies.append(enemy)
              enemy.tree_exited.connect(_on_enemy_removed)

          func spawn_morganth_boss() -> Node:
              if boss_active:
                  return null
              var boss := BOSS_SCENE.instantiate()
              if boss == null:
                  return null
              boss.position = Vector2(0, -spawn_radius)
              add_child(boss)
              boss_active = true
              boss_spawned.emit(boss)
              boss.tree_exited.connect(_on_boss_removed)
              return boss

          func _on_enemy_removed() -> void:
              _clean_enemy_list()
              if wave_running and active_enemies.is_empty():
                  wave_running = false
                  wave_completed.emit(current_wave)

          func _on_boss_removed() -> void:
              boss_active = false

          func _clean_enemy_list() -> void:
              var remaining: Array[Node] = []
              for enemy in active_enemies:
                  if is_instance_valid(enemy):
                      remaining.append(enemy)
              active_enemies = remaining

          func clear_all_enemies() -> void:
              for enemy in get_tree().get_nodes_in_group("enemies"):
                  if is_instance_valid(enemy):
                      enemy.queue_free()
              active_enemies.clear()
              wave_running = false
              boss_active = false

          func get_remaining_enemy_count() -> int:
              _clean_enemy_list()
              return active_enemies.size()

          func get_current_wave() -> int:
              return current_wave
          GD

