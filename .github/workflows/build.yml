      - name: Create world map manager
        shell: bash
        run: |
          cat > "$PROJECT_DIR/scripts/world/world_manager.gd" <<'GD'
          extends Node2D
          class_name WorldManager

          signal region_entered(region_id: String)
          signal region_completed(region_id: String)
          signal world_loading_started(region_id: String)
          signal world_loading_finished(region_id: String)
          signal checkpoint_reached(checkpoint_id: String)

          const REGION_DATA = preload("res://scripts/world/region_database.gd")

          var current_region: String = "forgotten_lands"
          var unlocked_regions: Array[String] = ["forgotten_lands"]
          var completed_regions: Array[String] = []
          var loading: bool = false
          var last_checkpoint: Vector2 = Vector2.ZERO
          var checkpoint_id: String = "start"
          var region_background: Sprite2D
          var player_reference: Node2D

          func _ready() -> void:
              add_to_group("world_manager")
              _create_background()
              enter_region(current_region)

          func _create_background() -> void:
              region_background = Sprite2D.new()
              region_background.name = "RegionBackground"
              region_background.centered = false
              region_background.z_index = -100
              region_background.texture_filter = CanvasItem.TEXTURE_FILTER_NEAREST
              add_child(region_background)

          func set_player_reference(player: Node2D) -> void:
              player_reference = player

          func enter_region(region_id: String) -> bool:
              if loading:
                  return false
              if not REGION_DATA.is_valid_region(region_id):
                  push_warning("Unknown region: " + region_id)
                  return false
              if not unlocked_regions.has(region_id):
                  push_warning("Region is locked: " + region_id)
                  return false
              loading = true
              world_loading_started.emit(region_id)
              current_region = region_id
              var data: Dictionary = REGION_DATA.get_region(region_id)
              var texture_path := str(data.get("background", ""))
              if ResourceLoader.exists(texture_path):
                  region_background.texture = load(texture_path)
              last_checkpoint = data.get("checkpoint", Vector2.ZERO)
              checkpoint_id = region_id + "_start"
              region_entered.emit(region_id)
              loading = false
              world_loading_finished.emit(region_id)
              return true

          func unlock_region(region_id: String) -> bool:
              if not REGION_DATA.is_valid_region(region_id):
                  return false
              if unlocked_regions.has(region_id):
                  return true
              unlocked_regions.append(region_id)
              return true

          func complete_current_region() -> void:
              if not completed_regions.has(current_region):
                  completed_regions.append(current_region)
              region_completed.emit(current_region)

          func save_checkpoint(id: String, position: Vector2) -> void:
              checkpoint_id = id
              last_checkpoint = position
              checkpoint_reached.emit(id)

          func respawn_player() -> void:
              if is_instance_valid(player_reference):
                  player_reference.global_position = last_checkpoint
                  if player_reference.has_method("restore_health"):
                      player_reference.restore_health()

          func get_current_region_data() -> Dictionary:
              return REGION_DATA.get_region(current_region)

          func get_unlocked_regions() -> Array[String]:
              return unlocked_regions.duplicate()

          func get_completed_regions() -> Array[String]:
              return completed_regions.duplicate()
          GD

      - name: Create level progression manager
        shell: bash
        run: |
          cat > "$PROJECT_DIR/scripts/world/level_progression.gd" <<'GD'
          extends Node
          class_name LevelProgression

          signal level_changed(new_level: int)
          signal experience_changed(current: int, required: int)
          signal level_up(new_level: int)
          signal reward_unlocked(reward_id: String)

          var level: int = 1
          var experience: int = 0
          var total_experience: int = 0
          var skill_points: int = 0
          var stat_points: int = 0

          func _ready() -> void:
              add_to_group("level_progression")

          func experience_required(target_level: int = -1) -> int:
              var target := level if target_level < 0 else target_level
              return int(80 + target * target * 24 + target * 12)

          func add_experience(amount: int) -> void:
              if amount <= 0:
                  return
              experience += amount
              total_experience += amount
              while experience >= experience_required():
                  experience -= experience_required()
                  _apply_level_up()
              experience_changed.emit(experience, experience_required())

          func _apply_level_up() -> void:
              level += 1
              skill_points += 1
              stat_points += 2
              level_changed.emit(level)
              level_up.emit(level)
              _check_level_rewards()

          func _check_level_rewards() -> void:
              if level == 5:
                  reward_unlocked.emit("shadow_skill")
              elif level == 10:
                  reward_unlocked.emit("second_weapon_slot")
              elif level == 15:
                  reward_unlocked.emit("void_mastery")
              elif level == 20:
                  reward_unlocked.emit("origin_power")

          func spend_skill_point() -> bool:
              if skill_points <= 0:
                  return false
              skill_points -= 1
              return true

          func spend_stat_point() -> bool:
              if stat_points <= 0:
                  return false
              stat_points -= 1
              return true

          func get_progress_ratio() -> float:
              var required := experience_required()
              if required <= 0:
                  return 0.0
              return clampf(float(experience) / float(required), 0.0, 1.0)
          GD

