          extends Control
          class_name ILARIONMainMenu

          signal new_game_requested()
          signal continue_requested()
          signal settings_requested()
          signal multiplayer_requested()
          signal credits_requested()

          var menu_buttons: Array[Button] = []
          var selected_index: int = 0
          var menu_container: VBoxContainer

          func _ready() -> void:
              _build_menu()
              _update_selection()

          func _build_menu() -> void:
              set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
              var background := ColorRect.new()
              background.color = ILARIONTheme.COLORS["background"]
              background.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
              add_child(background)

              var layout := VBoxContainer.new()
              layout.set_anchors_and_offsets_preset(Control.PRESET_CENTER)
              layout.position = Vector2(-125, -105)
              layout.custom_minimum_size = Vector2(250, 210)
              layout.add_theme_constant_override("separation", 8)
              add_child(layout)
              menu_container = layout

              var title := Label.new()
              title.text = "ILARION"
              title.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              title.add_theme_color_override(
                  "font_color", ILARIONTheme.COLORS["gold"]
              )
              title.add_theme_font_size_override("font_size", 30)
              layout.add_child(title)

              var subtitle := Label.new()
              subtitle.text = "إيلاريون — نهاية الخلق"
              subtitle.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              ILARIONTheme.configure_label(subtitle, 12)
              layout.add_child(subtitle)

              _add_menu_button("بداية جديدة", _on_new_game)
              _add_menu_button("متابعة الرحلة", _on_continue)
              _add_menu_button("اللعب الجماعي", _on_multiplayer)
              _add_menu_button("الإعدادات", _on_settings)
              _add_menu_button("عن اللعبة", _on_credits)

          func _add_menu_button(text_value: String, callback: Callable) -> void:
              var button := Button.new()
              button.text = text_value
              button.custom_minimum_size = Vector2(240, 30)
              button.focus_mode = Control.FOCUS_ALL
              ILARIONTheme.configure_button(button)
              button.pressed.connect(callback)
              menu_container.add_child(button)
              menu_buttons.append(button)

          func _update_selection() -> void:
              if menu_buttons.is_empty():
                  return
              selected_index = clampi(selected_index, 0, menu_buttons.size()-1)
              menu_buttons[selected_index].grab_focus()

          func _unhandled_input(event: InputEvent) -> void:
              if event.is_action_pressed("ui_down"):
                  selected_index = (selected_index + 1) % menu_buttons.size()
                  _update_selection()
              elif event.is_action_pressed("ui_up"):
                  selected_index = (selected_index - 1 + menu_buttons.size()) % menu_buttons.size()
                  _update_selection()

          func _on_new_game() -> void:
              new_game_requested.emit()

          func _on_continue() -> void:
              continue_requested.emit()

          func _on_multiplayer() -> void:
              multiplayer_requested.emit()

          func _on_settings() -> void:
              settings_requested.emit()

          func _on_credits() -> void:
              credits_requested.emit()
          GD

