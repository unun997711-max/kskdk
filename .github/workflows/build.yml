      # ==========================================
      # 21 - SKILL CONTROLLER
      # ==========================================

      - name: Create skill controller
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/scripts/combat/skill_controller.gd" <<'EOF'
          extends Node

          signal skill_used(skill_id: String)
          signal skill_failed(reason: String)
          signal cooldown_updated(skill_id: String, value: float)

          var energy: float = 100.0
          var cooldowns: Dictionary = {}

          var owner_character: Node2D

          func _ready() -> void:
              owner_character = get_parent()

          func _process(delta: float) -> void:
              for skill_id in cooldowns.keys():
                  cooldowns[skill_id] = maxf(
                      0.0,
                      float(cooldowns[skill_id]) - delta
                  )

                  cooldown_updated.emit(
                      skill_id,
                      float(cooldowns[skill_id])
                  )

          func use_skill(skill_id: String) -> bool:
              var skill := SkillDatabase.get_skill(skill_id)

              if skill.is_empty():
                  skill_failed.emit("مهارة غير موجودة")
                  return false

              var cooldown := float(
                  cooldowns.get(skill_id, 0.0)
              )

              if cooldown > 0.0:
                  skill_failed.emit("المهارة قيد الانتظار")
                  return false

              var cost := float(skill["cost"])

              if energy < cost:
                  skill_failed.emit("الطاقة غير كافية")
                  return false

              energy -= cost

              cooldowns[skill_id] = float(
                  skill["cooldown"]
              )

              execute_skill(skill_id, skill)

              skill_used.emit(skill_id)

              return true

          func execute_skill(
              skill_id: String,
              skill: Dictionary
          ) -> void:
              if not is_instance_valid(owner_character):
                  return

              if skill_id == "shadow_step":
                  var facing := 1

                  if owner_character.has_method("get"):
                      facing = int(
                          owner_character.get("facing")
                      )

                  owner_character.global_position.x += (
                      facing * float(skill["range"])
                  )

                  return

              var enemies := get_tree().get_nodes_in_group(
                  "enemies"
              )

              for enemy in enemies:
                  if not is_instance_valid(enemy):
                      continue

                  var distance := (
                      enemy.global_position -
                      owner_character.global_position
                  ).length()

                  if distance <= float(skill["range"]):
                      if enemy.has_method("take_damage"):
                          enemy.take_damage(
                              int(skill["damage"])
                          )

          func restore_energy(amount: float) -> void:
              energy = minf(
                  100.0,
                  energy + amount
              )

          func get_energy() -> float:
              return energy

          func get_cooldown(skill_id: String) -> float:
              return float(
                  cooldowns.get(skill_id, 0.0)
              )
          EOF

