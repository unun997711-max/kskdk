      - name: Create combat system
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/scripts/combat/combat_manager.gd" <<'EOF'
          extends Node

          signal attack_performed(attacker, attack_type)
          signal damage_dealt(target, amount)
          signal enemy_defeated(target)
          signal combo_changed(combo: int)
          signal special_used(skill_name: String)

          var combo_count: int = 0
          var combo_timer: float = 0.0
          var combo_timeout: float = 2.0

          var total_damage: int = 0
          var total_attacks: int = 0

          var combat_active: bool = true

          func _process(delta: float) -> void:
              if not combat_active:
                  return

              if combo_timer > 0.0:
                  combo_timer -= delta

                  if combo_timer <= 0.0:
                      reset_combo()

          func register_hit(target: Node, damage: int) -> void:
              if not combat_active:
                  return

              if not is_instance_valid(target):
                  return

              if not target.has_method("take_damage"):
                  return

              target.take_damage(damage)

              total_damage += damage
              total_attacks += 1

              combo_count += 1
              combo_timer = combo_timeout

              combo_changed.emit(combo_count)
              damage_dealt.emit(target, damage)

              if target.has_method("is_defeated"):
                  if target.is_defeated():
                      enemy_defeated.emit(target)

          func reset_combo() -> void:
              if combo_count == 0:
                  return

              combo_count = 0
              combo_changed.emit(combo_count)

          func get_combo_multiplier() -> float:
              if combo_count >= 20:
                  return 2.5

              if combo_count >= 10:
                  return 2.0

              if combo_count >= 5:
                  return 1.5

              return 1.0

          func get_total_damage() -> int:
              return total_damage

          func get_total_attacks() -> int:
              return total_attacks

          func reset_statistics() -> void:
              total_damage = 0
              total_attacks = 0
              reset_combo()
          EOF

