      - name: Generate ILARION enemy pixel art
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/assets/sprites/enemies"
          cat > "$PROJECT_DIR/assets/generate_enemies.py" <<'PY'
          from PIL import Image, ImageDraw
          import os

          OUT = "assets/sprites/enemies"
          os.makedirs(OUT, exist_ok=True)

          def make_enemy(name, palette, size=32, boss=False):
              frames = []
              for frame in range(4):
                  im = Image.new("RGBA", (size, size), (0, 0, 0, 0))
                  d = ImageDraw.Draw(im)
                  c1, c2, eye, shadow = palette
                  bob = frame % 2
                  cx = size // 2
                  if boss:
                      d.ellipse((cx-12, 5+bob, cx+12, 28+bob), fill=shadow)
                      d.polygon([(cx-13, 12+bob), (cx-20, 2),
                                 (cx-8, 9+bob)], fill=c1)
                      d.polygon([(cx+13, 12+bob), (cx+20, 2),
                                 (cx+8, 9+bob)], fill=c1)
                      d.ellipse((cx-10, 7+bob, cx+10, 25+bob), fill=c1)
                      d.rectangle((cx-8, 18+bob, cx+8, 26+bob), fill=c2)
                      d.rectangle((cx-7, 11+bob, cx-3, 14+bob), fill=eye)
                      d.rectangle((cx+3, 11+bob, cx+7, 14+bob), fill=eye)
                      d.polygon([(cx-9, 24+bob), (cx-5, 30),
                                 (cx-2, 24+bob)], fill=c2)
                      d.polygon([(cx+9, 24+bob), (cx+5, 30),
                                 (cx+2, 24+bob)], fill=c2)
                      d.rectangle((cx-14, 27, cx-7, 31), fill=shadow)
                      d.rectangle((cx+7, 27, cx+14, 31), fill=shadow)
                  else:
                      d.ellipse((cx-9, 8+bob, cx+9, 27+bob), fill=shadow)
                      d.ellipse((cx-8, 6+bob, cx+8, 24+bob), fill=c1)
                      d.rectangle((cx-6, 17+bob, cx+6, 25+bob), fill=c2)
                      d.rectangle((cx-6, 12+bob, cx-3, 15+bob), fill=eye)
                      d.rectangle((cx+3, 12+bob, cx+6, 15+bob), fill=eye)
                      d.polygon([(cx-7, 8+bob), (cx-11, 1),
                                 (cx-2, 7+bob)], fill=c2)
                      d.polygon([(cx+7, 8+bob), (cx+11, 1),
                                 (cx+2, 7+bob)], fill=c2)
                      d.rectangle((cx-9, 25, cx-4, 30), fill=shadow)
                      d.rectangle((cx+4, 25, cx+9, 30), fill=shadow)
                  frames.append(im)
              sheet = Image.new("RGBA", (size*4, size), (0, 0, 0, 0))
              for i, frame in enumerate(frames):
                  sheet.alpha_composite(frame, (i*size, 0))
              sheet.save(os.path.join(OUT, name + ".png"))

          make_enemy("ash_wolf", ((105, 105, 120, 255),
                                  (65, 65, 80, 255),
                                  (255, 80, 65, 255),
                                  (25, 25, 35, 255)))
          make_enemy("void_crawler", ((75, 35, 110, 255),
                                      (35, 15, 55, 255),
                                      (190, 80, 255, 255),
                                      (15, 5, 25, 255)))
          make_enemy("fallen_knight", ((120, 65, 65, 255),
