      - name: Create combo attack system
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/scripts/combat/combo_system.gd" <<'EOF'
          extends Node
          class_name ComboSystem

          signal combo_started
          signal combo_finished
          signal combo_stage_changed(stage: int)

          const MAX_COMBO_STAGE := 5
          const COMBO_RESET_TIME := 1.25

          var stage: int = 0
          var timer: float = 0.0
          var active: bool = false

          var combo_damage: int = 0

          const STAGE_DAMAGE = [
              15,
              20,
              25,
              32,
              45
          ]

          const STAGE_FORCE = [
              35.0,
              45.0,
              55.0,
              75.0,
              120.0
          ]

          func _process(delta: float) -> void:
              if not active:
                  return

              timer -= delta

              if timer <= 0.0:
                  finish_combo()

          func register_attack() -> Dictionary:
              if not active:
                  active = true
                  stage = 0
                  combo_damage = 0
                  combo_started.emit()

              stage = mini(stage + 1, MAX_COMBO_STAGE)
              timer = COMBO_RESET_TIME

              var index := stage - 1

              var result := {
                  "stage": stage,
                  "damage": STAGE_DAMAGE[index],
                  "force": STAGE_FORCE[index],
                  "finisher": stage == MAX_COMBO_STAGE
              }

              combo_damage += int(result["damage"])

              combo_stage_changed.emit(stage)

              return result

          func finish_combo() -> void:
              if not active:
                  return

              active = false
              stage = 0
              timer = 0.0

              combo_finished.emit()

          func get_stage() -> int:
              return stage

          func get_combo_damage() -> int:
              return combo_damage

          func is_active() -> bool:
              return active
          EOF

      # ==========================================
      # 19 - VOID POWER SYSTEM
      # ==========================================

      - name: Create void power system
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/scripts/combat/void_power.gd" <<'EOF'
          extends Node
          class_name VoidPower

          signal void_energy_changed(value: float)
          signal memory_lost(amount: int)
          signal void_activated
          signal void_deactivated

          const MAX_VOID_ENERGY := 100.0
          const VOID_DRAIN_RATE := 18.0
          const MEMORY_COST := 3

          var energy: float = 100.0
          var active: bool = false
          var power_level: int = 1

          var total_activations: int = 0
          var memories_erased: int = 0

          var activation_time: float = 0.0

          func _process(delta: float) -> void:
              if not active:
                  energy = minf(
                      MAX_VOID_ENERGY,
                      energy + 4.0 * delta
                  )

                  void_energy_changed.emit(energy)
                  return

              activation_time += delta

              energy -= VOID_DRAIN_RATE * delta

              if energy <= 0.0:
                  energy = 0.0
                  deactivate()

              void_energy_changed.emit(energy)

          func activate() -> bool:
              if active:
                  return false

              if energy < 20.0:
                  return false

              active = true
              total_activations += 1

              void_activated.emit()

              return true

          func deactivate() -> void:
              if not active:
                  return

              active = false

              void_deactivated.emit()

          func consume_energy(amount: float) -> bool:
              if amount <= 0.0:
                  return false

              if energy < amount:
                  return false

              energy -= amount
              void_energy_changed.emit(energy)

              return true

          func calculate_void_damage(base_damage: int) -> int:
              if not active:
                  return base_damage

              var multiplier := 1.0 + (float(power_level) * 0.35)

              return int(float(base_damage) * multiplier)

          func erase_memory() -> void:
              memories_erased += MEMORY_COST
              memory_lost.emit(MEMORY_COST)

          func upgrade_power() -> void:
              power_level = mini(power_level + 1, 5)

          func get_energy() -> float:
              return energy

          func get_power_level() -> int:
              return power_level

          func is_active() -> bool:
              return active
          EOF

